protocols = imap
listen = *
ssl = required
ssl_cert = </tls/server.pem
ssl_key = </tls/server.key
disable_plaintext_auth = yes
auth_mechanisms = plain login
mail_location = maildir:~/Maildir
first_valid_uid = 60000

passdb {
  driver = passwd-file
  args = scheme=PLAIN /fixture/imap-users
}
userdb {
  driver = static
  args = uid=60000 gid=60000 home=/mail/%u
}

service imap-login {
  inet_listener imap {
    port = 0
  }
  inet_listener imaps {
    port = 1993
    ssl = yes
  }
}
log_path = /dev/stderr
