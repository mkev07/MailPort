name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
  rust-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
  rust-core:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: cargo test --locked -p mailport-core
      - run: npm run check:compatibility
  native-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: '--debug --bundles app'
          - os: windows-latest
            args: '--debug --config src-tauri/tauri.windows.conf.json --bundles nsis'
            artifact: mailport-vault-windows-preview
            artifacts: target/debug/bundle/nsis/*.exe
          - os: ubuntu-24.04
            args: '--debug --config src-tauri/tauri.linux.conf.json --bundles deb,appimage'
            artifact: mailport-vault-linux-preview
            artifacts: |
              target/debug/bundle/deb/*.deb
              target/debug/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    env:
      APPIMAGE_EXTRACT_AND_RUN: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb xauth dbus-x11 libfuse2t64 xdotool
      - run: npm ci
      - run: npm run vault:build -- ${{ matrix.args }}
      - run: cargo test --locked -p mailport --lib
      - if: runner.os == 'Linux'
        name: Launch Linux preview packages
        shell: bash
        run: |
          for package in target/debug/bundle/deb/*.deb; do
            dpkg-deb --info "$package"
            dpkg-deb --extract "$package" "$RUNNER_TEMP/mailport-deb"
          done
          test -x "$RUNNER_TEMP/mailport-deb/usr/bin/MailPort"
          launch() {
            local package="$1" data="$2" require_fuse="${3:-no}"
            mkdir -p "$data/config"
            echo "Launching $package"
            XDG_DATA_HOME="$data" XDG_CONFIG_HOME="$data/config" \
              timeout --kill-after=5s 45s xvfb-run -a dbus-run-session -- \
              bash -euc '
                "$1" &
                pid=$!
                trap "kill $pid 2>/dev/null || true; wait $pid 2>/dev/null || true" EXIT
                for ((attempt = 0; attempt < 30; attempt++)); do
                  if ! kill -0 "$pid" 2>/dev/null; then
                    status=0
                    wait "$pid" || status=$?
                    echo "MailPort exited before startup verification (exit $status)" >&2
                    exit 1
                  fi
                  if test -d "$XDG_DATA_HOME/org.mailport.vault"; then
                    if test "$2" = yes; then
                      if ! xdotool search --onlyvisible --name "^MailPort Vault$" >/dev/null; then
                        sleep 1
                        continue
                      fi
                      findmnt --list --noheadings --output TARGET,FSTYPE |
                        awk "\$1 ~ /\/\.mount_/ && \$2 ~ /^fuse([.]|\$)/ { mounted = 1 } END { exit !mounted }"
                      echo "The AppImage opened its Vault window from a live FUSE mount"
                    fi
                    sleep 2
                    kill -0 "$pid"
                    echo "MailPort initialized the isolated profile and stayed running"
                    exit 0
                  fi
                  sleep 1
                done
                echo "MailPort did not initialize its isolated profile" >&2
                exit 1
              ' bash "$package" "$require_fuse"
          }
          launch "$RUNNER_TEMP/mailport-deb/usr/bin/MailPort" "$RUNNER_TEMP/mailport-deb-profile"
          for package in target/debug/bundle/appimage/*.AppImage; do
            launch "$(realpath "$package")" "$RUNNER_TEMP/mailport-appimage-profile"
            if ! test -c /dev/fuse; then
              sudo modprobe fuse
            fi
            test -r /dev/fuse && test -w /dev/fuse
            (unset APPIMAGE_EXTRACT_AND_RUN; launch "$(realpath "$package")" "$RUNNER_TEMP/mailport-appimage-fuse-profile" yes)
          done
      - if: runner.os == 'Windows'
        name: Install and launch the Windows preview
        shell: pwsh
        run: |
          $installer = Get-ChildItem target/debug/bundle/nsis -Filter '*-setup.exe' | Select-Object -First 1
          if (!$installer) { throw 'MailPort installer is missing' }
          $installDir = Join-Path $env:RUNNER_TEMP 'mailport-installed'
          $setup = Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "MailPort setup exited with $($setup.ExitCode)" }
          $app = Start-Process -FilePath (Join-Path $installDir 'MailPort.exe') -PassThru
          try {
            for ($i = 0; $i -lt 30; $i++) {
              $app.Refresh()
              if ($app.HasExited) { throw "MailPort exited with $($app.ExitCode)" }
              if ($app.MainWindowHandle -ne [IntPtr]::Zero) { break }
              Start-Sleep -Seconds 1
            }
            if ($app.MainWindowHandle -eq [IntPtr]::Zero) { throw 'MailPort did not open a window' }
          } finally {
            if (!$app.HasExited) { Stop-Process -Id $app.Id }
          }
      - if: matrix.artifact && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 7
