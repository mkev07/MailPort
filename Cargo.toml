[workspace]
resolver = "2"
members = ["apps/vault/src-tauri", "packages/vault-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Keep local vault writes responsive in debug builds with the same KDF parameters.
[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.salsa20]
opt-level = 3
