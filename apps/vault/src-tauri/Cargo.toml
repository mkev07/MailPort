[package]
name = "mailport"
version.workspace = true
edition.workspace = true
description = "MailPort Vault — portable email accounts"
license.workspace = true

[lib]
name = "mailport_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "MailPort"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
mailport-core = { path = "../../../packages/vault-core" }
serde_json.workspace = true
zeroize = "1"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"

serde.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = { version = "0.6", features = ["exception"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSColor", "NSImage", "NSUserInterfaceItemIdentification", "NSView", "NSVisualEffectView", "NSWindow", "block2", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", features = ["NSDictionary", "NSString", "objc2-core-foundation"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["CALayer", "objc2-core-foundation", "objc2-core-graphics"] }
raw-window-handle = "0.6"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2.4.1"
